name: Sync Auriga Calendar

on:
  schedule:
    # Run twice every day at 06:00 and 18:00 UTC
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Auriga planning & generate .ics
        env:
          AURIGA_USERNAME: ${{ secrets.AURIGA_USERNAME }}
          AURIGA_PASSWORD: ${{ secrets.AURIGA_PASSWORD }}
        run: |
          python3 auriga_to_ics.py -o calendar.ics

      - name: Commit and push updated calendar
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f calendar.ics
          if git diff --staged --quiet; then
            echo "No calendar updates found."
          else
            git commit -m "Update Auriga schedule [skip ci]"
            git push
          fi
