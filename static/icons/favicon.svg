<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1e38"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Calendar Body Frame -->
  <rect x="96" y="96" width="320" height="320" rx="40" fill="#0b1320" stroke="#38bdf8" stroke-width="8"/>
  <!-- Header Bar -->
  <path d="M 96,136 A 40,40 0 0,1 136,96 L 376,96 A 40,40 0 0,1 416,136 L 416,176 L 96,176 Z" fill="url(#headerGrad)"/>
  <!-- Rings -->
  <circle cx="180" cy="96" r="14" fill="#ffffff"/>
  <circle cx="332" cy="96" r="14" fill="#ffffff"/>
  <!-- Grid Items (Stylized Calendar Matrix) -->
  <rect x="140" y="215" width="55" height="45" rx="10" fill="#38bdf8"/>
  <rect x="228" y="215" width="55" height="45" rx="10" fill="#38bdf8"/>
  <rect x="316" y="215" width="55" height="45" rx="10" fill="#22c55e"/>
  
  <rect x="140" y="295" width="55" height="45" rx="10" fill="#38bdf8"/>
  <rect x="228" y="295" width="55" height="45" rx="10" fill="#eab308"/>
  <rect x="316" y="295" width="55" height="45" rx="10" fill="#ef4444"/>
</svg>
