[package]
name = "epikairos"
version = "0.3.0"
edition = "2021"
authors = ["Fernand Huttois <fernand.huttois@epita.fr>"]
description = "EpiKairos - High-performance EPITA Auriga Calendar Platform in Rust"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.38", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "trace", "set-header", "cors"] }
tower-cookies = "0.10"
minijinja = { version = "2.0", features = ["loader", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
regex = "1.10"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
aes-gcm = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto"] }
hmac = "0.12"
