version: '3.8'

services:
  auriga-calendar:
    build: .
    container_name: auriga-calendar
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - FLASK_SECRET_KEY=change-this-secret-key-in-production
      - FEED_CACHE_DURATION=7200
    volumes:
      - ./data:/app/data
